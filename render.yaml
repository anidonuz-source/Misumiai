services:
  - type: web
    name: misumi-ai
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_CHAT_IDS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: SAMBANOVA_API_KEY
        sync: false
      - key: SAMBANOVA_MODEL
        value: DeepSeek-V3-0324
      - key: SAMBANOVA_MODEL_FAST
        value: Meta-Llama-3.3-70B-Instruct
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: ADMIN_SECRET
        sync: false
